name: RaceSafe CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: racesafe
          POSTGRES_PASSWORD: racesafe_ci
          POSTGRES_DB: racesafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U racesafe -d racesafe_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://racesafe:racesafe_ci@127.0.0.1:5432/racesafe_test
      TEST_DATABASE_URL: postgresql+asyncpg://racesafe:racesafe_ci@127.0.0.1:5432/racesafe_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
      - run: python -m pytest -q tests/test_concurrency.py --count=5

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  board-benchmark:
    name: Board benchmark (${{ matrix.seed_users }} seeded users)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        seed_users: [10000, 20000]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: racesafe
          POSTGRES_PASSWORD: racesafe_ci
          POSTGRES_DB: racesafe_benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U racesafe -d racesafe_benchmark"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://racesafe:racesafe_ci@127.0.0.1:5432/racesafe_benchmark
      PACE_SECONDS: '0'
      SEED_USERS: ${{ matrix.seed_users }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.4.0'
      - run: python -m pip install -r requirements.txt
      - name: Prepare benchmark credentials
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key in ("JWT_SECRET", "SEED_PASSWORD"):
                  value = secrets.token_hex(32)
                  print(f"::add-mask::{value}")
                  print(f"{key}={value}", file=env)
              print(f"BOARD_TOKEN_FILE={os.environ['RUNNER_TEMP']}/board-tokens.json", file=env)
          PY
      - name: Migrate and seed PostgreSQL
        run: |
          python -m alembic upgrade head
          python -m scripts.seed --users "$SEED_USERS" --board-tokens "$BOARD_TOKEN_FILE"
      - name: Run the 100-user board benchmark
        shell: bash
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/racesafe.log" 2>&1 &
          api_pid=$!
          trap 'status=$?; kill "$api_pid" 2>/dev/null || true; if (( status != 0 )); then cat "$RUNNER_TEMP/racesafe.log"; fi' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8000/api/health; then
              break
            fi
            kill -0 "$api_pid"
            sleep 1
          done
          curl --silent --fail --max-time 2 http://127.0.0.1:8000/api/health
          k6 run loadtest/board.js
      - name: Upload the board benchmark report
        if: ${{ always() && hashFiles('loadtest/report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: board-benchmark-report-${{ matrix.seed_users }}-users
          path: loadtest/report.json
