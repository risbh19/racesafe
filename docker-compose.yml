services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: racesafe
      POSTGRES_PASSWORD: racesafe_dev
      POSTGRES_DB: racesafe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - racesafe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racesafe -d racesafe"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  racesafe_pgdata:
